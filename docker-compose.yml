services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: friendlypoker
      POSTGRES_USER: poker
      POSTGRES_PASSWORD: poker
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/friendlypoker
      SPRING_DATASOURCE_USERNAME: poker
      SPRING_DATASOURCE_PASSWORD: poker
      APP_JWT_SECRET: eW91ci0yNTYtYml0LXNlY3JldC1jaGFuZ2UtaW4tcHJvZC1wbGVhc2UtZG8taXQ=
      APP_JWT_EXPIRATION_MS: 86400000

volumes:
  pgdata: