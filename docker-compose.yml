services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: friendlypoker
      POSTGRES_USER: poker
      POSTGRES_PASSWORD: poker
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    volumes:
      - ./logs:/app/logs
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/friendlypoker
      DB_USER: poker
      DB_PASSWORD: poker
      JWT_SECRET: eW91ci0yNTYtYml0LXNlY3JldC1jaGFuZ2UtaW4tcHJvZC1wbGVhc2UtZG8taXQ=
      JWT_EXPIRATION_MS: 86400000

volumes:
  pgdata: